name: ci

# Pull requests and the development branch. main is verified by the release
# workflow, so a merge is never checked twice.
on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The package has no install scripts, and pnpm refuses to run dependency
      # build scripts without an explicit approval list.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: pnpm run check
