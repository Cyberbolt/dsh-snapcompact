name: publish

# Releases are driven by the version in package.json. Every push to main runs
# the full check suite and then publishes that exact version only when the npm
# registry does not have it yet. Trusted publishing replaces long-lived tokens:
# npm exchanges the GitHub OIDC token for a short-lived credential bound to this
# repository and this exact workflow filename, and attaches provenance.
on:
  push:
    branches: [main]
  # Retry path for a failed run. Dispatch from main so the published tree is the
  # tree reviewers merged.
  workflow_dispatch:

# One release at a time: a queued run re-evaluates the version after the
# previous one finishes, so a duplicate publish cannot race.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # id-token is what makes trusted publishing work; contents is needed to
      # create the version tag and the GitHub release.
      id-token: write
      contents: write
    env:
      # A contributor's `.npmrc` may point at a mirror. Install, publish,
      # tagging and verification must all agree on the registry the release
      # lands in, so the public registry is set once for the whole job.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Require the default branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::publish runs from refs/heads/main only (got ${GITHUB_REF})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Cheap and dependency-free: decides whether there is anything to do.
      # Runs before `pnpm install`, so it must not rely on node_modules.
      - name: Plan the release
        id: release
        run: node --experimental-strip-types scripts/release.ts

      # The package has no install scripts, and pnpm refuses to run dependency
      # build scripts without an explicit approval list.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Types, lint, formatting, ESM build into dist/, preset build, tests and
      # the packaged-resource contract. dist/ is gitignored, so this is what
      # produces the artifacts that ship.
      - name: Verify the tree that would ship
        run: pnpm run check

      - name: Require a CLI with trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: |
          version=$(npm --version)
          echo "npm ${version}"
          node -e '
            const [major = 0, minor = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`::error::npm ${process.argv[1]} cannot publish with OIDC; install npm >= 11.5.1`);
              process.exit(1);
            }
          ' "${version}"

      - name: Publish with OIDC
        id: publish
        if: steps.release.outputs.publish == 'true'
        # --ignore-scripts: prepublishOnly reruns the checks above.
        # The registry comes from NPM_CONFIG_REGISTRY above.
        run: npm publish --ignore-scripts --tag "${{ steps.release.outputs.dist_tag }}"

      # Also runs when the version was already published by an earlier attempt,
      # so a failed tag or release step can be repaired by re-running the job.
      #
      # Deliberately before the registry check: the release is the deliverable
      # and a slow registry must not cost it. `gitHead` is only readable once
      # the version is public, which is exactly the repair case; right after a
      # fresh publish the fallback is this commit, which is the same target.
      - name: Tag and publish the GitHub release
        if: (steps.release.outputs.publish == 'true' && steps.publish.outcome == 'success') || steps.release.outputs.reason == 'already-published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already has a release"
            exit 0
          fi
          # npm records the published commit, which is the accurate target even
          # when the release is repaired from a later commit.
          target=$(npm view "dsh-snapcompact@${version}" gitHead 2>/dev/null || true)
          if [ -z "${target}" ]; then
            target="${GITHUB_SHA}"
          fi
          arguments=(--target "${target}" --title "${tag}" --generate-notes)
          case "${version}" in
            *-*) arguments+=(--prerelease) ;;
          esac
          gh release create "${tag}" "${arguments[@]}"

      # Last, and patient. `npm publish` returns before the public packument
      # serves the new version: 0.1.2 became readable about 56 s later and
      # 0.2.0 about 78 s later, so the previous fixed 60 s window failed by a
      # few seconds. scripts/verify-release.ts polls with backoff for up to
      # five minutes and asserts the dist-tag, integrity and provenance.
      - name: Verify the registry state
        run: >-
          node --experimental-strip-types scripts/verify-release.ts
          "${{ steps.release.outputs.version }}"
          "${{ steps.release.outputs.dist_tag }}"
